<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List App - Practica de Laboratorio</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="container">
        <div class="to-do-app">
            <h2> Lista de Tareas <img src="img/ico1.png" alt="Icono de tareas"></h2>
            <div class="row">
                <input type="text" id="input-box" placeholder="Añade tu tarea aquí...">
                <button onclick="addTask()">Añadir</button>
            </div>
            <ul id="list-container">
                 <!-- las tareas agregadas inámicas mediante Java script apareceraán aquí-->
            </ul>

        </div>

    </div>

    <h3>Autor janeth Mata Vera </h3>
     
    <script src="script.js"> </script>
</body>
</html>
